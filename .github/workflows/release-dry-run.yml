name: Release dry run

# Builds and verifies everything a release publishes, without uploading: cross-platform Python
# wheels + sdist, stripped CLI binaries, license file checks, and `cargo publish --dry-run`.
# Run manually before tagging a release (Actions -> Release dry run -> Run workflow).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/release-build.yml

  crates:
    name: Dry-run cargo publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain set by input
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Package and verify richdem and richdem-cli
        run: cargo publish --dry-run -p richdem -p richdem-cli
