name: docs

on:
  push:
    branches: [main]
  pull_request:
    paths: ["docs/**", "js/**", "crates/richdem/**", "zensical.toml", "requirements_docs.txt", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR checks must not replace a queued main deployment. Only a newer check on
  # the same PR may cancel an active build; main publishing remains serialized.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain set by input
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: js
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: wasm-pack@0.15.1
      - name: Build docs with Zensical
        run: |
          uv venv --python 3.12
          uv pip install -r requirements_docs.txt
          .venv/bin/zensical build
          test -f site/CNAME
          test -f site/install.sh
          test -f site/install.ps1
      - name: Build browser WASM bundle for Playground
        run: |
          (cd js && wasm-pack build --target web --release --out-dir ../site/wasm -- --locked)
          rm -f site/wasm/.gitignore
          test -f site/wasm/richdem_js.js
          test -f site/wasm/richdem_js_bg.wasm
      - name: Lint and smoke-test installer scripts
        run: |
          sh -n docs/install.sh
          shellcheck docs/install.sh
          pwsh -NoProfile -Command '
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile("docs/install.ps1", [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.ToString() }
              exit 1
            }
          '
          # Smoke-test install.sh against a local file:// mirror (happy path + broken-binary preservation)
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          arch=$(uname -m)
          target="${arch}-unknown-linux-musl"
          name="richdem-cli-v0.0.1-${target}"
          mkdir -p "$tmp/mirror/$name" "$tmp/bin"
          printf '#!/bin/sh\necho "richdem 0.0.1"\n' > "$tmp/mirror/$name/richdem"
          chmod 755 "$tmp/mirror/$name/richdem"
          tar -czf "$tmp/mirror/$name.tar.gz" -C "$tmp/mirror" "$name"
          sha256sum "$tmp/mirror/$name.tar.gz" > "$tmp/mirror/$name.tar.gz.sha256"
          RICHDEM_VERSION="0.0.1" RICHDEM_INSTALL_DIR="$tmp/bin" RICHDEM_DOWNLOAD_URL="file://$tmp/mirror" sh docs/install.sh
          test "$("$tmp/bin/richdem" --version)" = "richdem 0.0.1"
          # Broken binary must fail without overwriting the existing working binary
          name_bad="richdem-cli-v0.0.2-${target}"
          mkdir -p "$tmp/mirror/$name_bad"
          printf '#!/bin/sh\nexit 1\n' > "$tmp/mirror/$name_bad/richdem"
          chmod 755 "$tmp/mirror/$name_bad/richdem"
          tar -czf "$tmp/mirror/$name_bad.tar.gz" -C "$tmp/mirror" "$name_bad"
          sha256sum "$tmp/mirror/$name_bad.tar.gz" > "$tmp/mirror/$name_bad.tar.gz.sha256"
          if RICHDEM_VERSION="0.0.2" RICHDEM_INSTALL_DIR="$tmp/bin" RICHDEM_DOWNLOAD_URL="file://$tmp/mirror" sh docs/install.sh; then
            echo "expected broken binary install to fail" >&2
            exit 1
          fi
          test "$("$tmp/bin/richdem" --version)" = "richdem 0.0.1"
          test ! -e "$tmp/bin/richdem.tmp"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: ./site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: docs-pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
