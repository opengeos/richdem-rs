name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain set by input
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (default features)
        run: cargo test --workspace
      - name: Test (no default features)
        run: cargo test -p richdem --no-default-features --lib
      - name: Test (all features)
        run: cargo test --workspace --all-features

  python:
    name: Python bindings (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain set by input
        with:
          toolchain: stable
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build and test Python package
        working-directory: python
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin pytest numpy
          maturin develop --release
          pytest -v

  wasm:
    name: WebAssembly (richdem-js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain set by input
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: js
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: wasm-pack@0.15.1
      - name: Format check (js)
        run: cargo fmt --manifest-path js/Cargo.toml -- --check
      - name: Clippy (wasm32)
        run: cargo clippy --manifest-path js/Cargo.toml --locked --target wasm32-unknown-unknown -- -D warnings
      - name: Build and test Node.js WASM bundle
        working-directory: js
        run: |
          wasm-pack build --target nodejs --release --out-dir pkg-node -- --locked
          node test.mjs
      - name: Build browser WASM bundle
        working-directory: js
        run: wasm-pack build --target web --release --out-dir pkg -- --locked

  # RustSec advisories for all three lockfiles, with the ignores in .cargo/audit.toml (read from the
  # repository root). Unsound/unmaintained advisories are warnings and do not fail the job.
  audit:
    name: RustSec advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain set by input
        with:
          toolchain: stable
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-audit@0.22.2
      # Only js/Cargo.lock is tracked; resolve the root and python/ lockfiles fresh, as users of the
      # published crates and wheels do. This is deliberately a tripwire: a new advisory ID against any
      # dependency fails this job. Ignores match advisory IDs, not crate versions, so a resolution
      # that still hits an ignored ID passes silently.
      - name: Generate lockfiles
        run: |
          cargo generate-lockfile
          cargo generate-lockfile --manifest-path python/Cargo.toml
      - name: cargo audit
        run: |
          cargo audit
          cargo audit --no-fetch -f python/Cargo.lock
          cargo audit --no-fetch -f js/Cargo.lock
