[package]
name = "richdem-py"
description = "Python bindings for richdem-rs (pure-Rust port of RichDEM with terrio raster I/O)"
publish = false
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.90"
repository = "https://github.com/opengeos/richdem-rs"

[lib]
name = "_richdem_rs"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
richdem = { path = "../crates/richdem", features = ["terrio", "parallel"] }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }
numpy = "0.29"
