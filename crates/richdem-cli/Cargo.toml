[package]
name = "richdem-cli"
description = "Command-line tools for richdem-rs (pure-Rust port of RichDEM's rd_* utilities)"
readme = "../../README.md"
keywords = ["gis", "dem", "hydrology", "terrain", "cli"]
categories = ["science::geo", "command-line-utilities"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "richdem"
path = "src/main.rs"

[dependencies]
richdem = { workspace = true, features = ["terrio", "parallel", "serde"] }
clap.workspace = true
serde_json.workspace = true
