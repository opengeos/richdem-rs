[project]
site_name = "richdem-rs"
site_description = "High-performance Digital Elevation Model (DEM) hydrologic and terrain analysis in pure Rust, with GDAL-free geospatial raster I/O powered by terrio"
site_author = "opengeos"
site_url = "https://richdem-rs.opengeos.org"
repo_url = "https://github.com/opengeos/richdem-rs"
repo_name = "opengeos/richdem-rs"
copyright = "richdem-rs is released under the GNU General Public License v3.0 (GPL-3.0-only). Ported from <a href=\"https://github.com/r-barnes/richdem\">RichDEM</a> by Richard Barnes; see <a href=\"https://github.com/opengeos/richdem-rs/blob/main/NOTICE\">NOTICE</a>."

nav = [
  { "Home" = "index.md" },
  { "Get Started" = [
    { "Installation" = "installation.md" },
    { "Getting Started" = "getting-started.md" },
    { "Coming from RichDEM" = "coming-from-richdem.md" },
  ] },
  { "Algorithms" = [
    { "Depressions & Breaching" = "depressions.md" },
    { "Flats & Flow Routing" = "flow-routing.md" },
    { "Terrain Attributes" = "terrain-attributes.md" },
    { "Depression Hierarchies & FSM" = "depression-hierarchy.md" },
  ] },
  { "Interfaces" = [
    { "Python" = "python.md" },
    { "Rust Library" = "rust.md" },
    { "Command Line" = "cli.md" },
  ] },
  { "Quality" = [
    { "Benchmarks" = "benchmarks.md" },
    { "Multithreading" = "parallelism.md" },
  ] },
  { "Project" = [
    { "Publications & Credits" = "credits.md" },
    { "Report Issues" = "https://github.com/opengeos/richdem-rs/issues" },
  ] },
]

[project.theme]
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
features = [
  "content.code.copy",
  "navigation.indexes",
  "navigation.footer",
  "navigation.instant",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.share",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "default"
primary = "teal"
accent = "deep orange"
toggle.icon = "material/toggle-switch-off-outline"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "teal"
accent = "deep orange"
toggle.icon = "material/toggle-switch"
toggle.name = "Switch to light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
