[package]
name = "richdem-js"
description = "WebAssembly bindings for richdem-rs: pure-Rust DEM hydrologic and terrain analysis (Priority-Flood, Lindsay breaching, Flow Accumulation, Depression Hierarchies, Fill-Spill-Merge) in browsers and Node.js"
publish = false
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.90"
repository = "https://github.com/opengeos/richdem-rs"
authors = ["Richard Barnes <rbarnes@umn.edu>", "Qiusheng Wu <giswqs@gmail.com>"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
richdem = { path = "../crates/richdem", default-features = false, features = ["terrio", "serde"] }
terrio = { version = "0.9", default-features = false, features = ["geotiff"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
